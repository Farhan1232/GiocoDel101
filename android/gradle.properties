# Sized for a 7.7 GB machine. The previous -Xmx8G could not be honoured and
# the daemon was OOM-killed mid-build, which surfaces as the misleading
# "Gradle build daemon disappeared unexpectedly".
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=1
# One JVM instead of three. A release build on this machine was killed twice
# by the low-memory watchdog with the defaults: the Gradle launcher, a Gradle
# daemon and a Kotlin daemon each hold their own heap on top of the Dart AOT
# compile. Running Kotlin in-process and skipping the daemon costs a little
# start-up time on a cold build and roughly a gigabyte less peak.
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
